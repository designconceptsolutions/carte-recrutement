name: Synchroniser le tableau

# Relit les onglets publiés et met à jour src/data/rows.json.
# Un commit n'est produit que si le contenu a changé ; ce commit déclenche
# le redéploiement Vercel, donc la carte suit le tableau sans intervention.
#
# Trois déclencheurs :
#   - repository_dispatch : immédiat, appelé par le script Google Sheets
#     à chaque modification du tableau (voir scripts/apps-script/) ;
#   - schedule : filet de sécurité, au cas où le script ne se déclenche pas ;
#   - workflow_dispatch : lancement manuel depuis l'onglet Actions.
on:
  repository_dispatch:
    types: [sheet-updated]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      baseline:
        description: "Repartir d'une base propre : aucune ligne marquée « nouvelle »"
        type: boolean
        default: false

concurrency:
  group: sync-sheet
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lire les onglets et mettre à jour rows.json
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
        run: |
          node scripts/sync-sheet.mjs \
            ${{ inputs.baseline && '--baseline --force' || '' }}

      - name: Publier si le tableau a changé
        run: |
          if git diff --quiet -- src/data/rows.json; then
            echo "Aucun changement dans le tableau."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/rows.json
          git commit -m "Synchronisation du tableau de suivi"

          # Le push échoue de deux façons, toutes deux passagères : une erreur
          # 500 de GitHub, ou un rejet parce qu'un autre passage a commité
          # entre-temps. Le rebase règle le second cas, la reprise le premier.
          for tentative in 1 2 3 4 5; do
            if git push; then
              echo "Publié (tentative $tentative)."
              exit 0
            fi
            echo "Push échoué (tentative $tentative), nouvelle tentative…"
            sleep $((tentative * 5))
            git pull --rebase origin main || true
          done

          echo "::error::Push impossible après 5 tentatives."
          exit 1
